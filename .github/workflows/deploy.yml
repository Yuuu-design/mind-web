name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "=== 开始部署 $(date) ==="

            cd /root/mind-web

            echo "📥 拉取最新代码..."
            git pull origin main

            echo "🔨 构建 Docker 镜像..."
            docker build --no-cache -t mind-web .

            echo "🛑 停止旧容器..."
            docker stop mind-web 2>/dev/null || true
            docker rm mind-web 2>/dev/null || true

            echo "🚀 启动新容器..."
            docker run -d --name mind-web -p 8080:8080 --restart unless-stopped mind-web

            echo "✅ 验证部署..."
            sleep 3
            curl -s -o /dev/null -w "HTTP状态码: %{http_code}\n" http://localhost:8080

            echo "=== 部署完成 ==="
